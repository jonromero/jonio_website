<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CUTFLOW MOBILE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card: #141417;
      --border: #27272a;
      --keep: #10b981;
      --cut: #ef4444;
      --text: #fafafa;
      --muted: #a1a1aa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom);
      overscroll-behavior: none;
    }

    /* Top Bar */
    header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand span {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--keep);
      border-radius: 50%;
    }

    .file-btn {
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Video Deck */
    .viewport {
      position: relative;
      background: #000;
      aspect-ratio: 16 / 9;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .empty-state {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      padding: 20px;
    }

    /* Scrubber & Timeline */
    .timeline-container {
      padding: 12px 16px 4px;
    }

    .timeline-track {
      position: relative;
      height: 24px;
      background: #18181b;
      border-radius: 6px;
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
    }

    .segment-overlay {
      position: absolute;
      top: 0;
      bottom: 0;
      opacity: 0.85;
    }

    .segment-keep { background: rgba(16, 185, 129, 0.4); border-left: 2px solid var(--keep); border-right: 2px solid var(--keep); }
    .segment-cut  { background: rgba(239, 68, 68, 0.4);  border-left: 2px solid var(--cut);  border-right: 2px solid var(--cut); }

    .playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #ffffff;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.9);
      pointer-events: none;
      z-index: 5;
    }

    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* Mode Pill Selector */
    .mode-bar {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .mode-btn.active-keep {
      background: rgba(16, 185, 129, 0.12);
      border-color: var(--keep);
      color: var(--keep);
    }

    .mode-btn.active-cut {
      background: rgba(239, 68, 68, 0.12);
      border-color: var(--cut);
      color: var(--cut);
    }

    /* Bottom Control Cluster */
    .controls-deck {
      margin-top: auto;
      padding: 12px 16px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .transport-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-btn {
      flex: 1;
      height: 48px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .play-btn {
      flex: 1.4;
      background: #27272a;
      font-size: 15px;
    }

    /* Giant Touch Trigger */
    .trigger-btn {
      width: 100%;
      height: 64px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.08s ease, filter 0.15s ease;
    }

    .trigger-btn:active {
      transform: scale(0.98);
    }

    .trigger-idle {
      background: #27272a;
      color: #fff;
    }

    .trigger-recording {
      background: var(--cut);
      color: #fff;
      animation: pulse 1.2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.25); }
    }

    /* Segments Drawer & Export Buttons */
    .drawer {
      padding: 12px 16px;
      max-height: 180px;
      overflow-y: auto;
    }

    .drawer-header {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .segment-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 11px;
    }

    .segment-card .nudge-group {
      display: flex;
      gap: 4px;
    }

    .nudge-btn {
      background: #27272a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
    }

    .del-btn {
      color: var(--cut);
      background: transparent;
      border: none;
      font-size: 14px;
      padding: 4px 8px;
      cursor: pointer;
    }

    .export-bar {
      display: flex;
      gap: 8px;
      padding: 8px 16px 12px;
    }

    .exp-btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      text-align: center;
    }

    .exp-btn.primary {
      background: #ffffff;
      color: #000000;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand"><span></span> CUTFLOW</div>
    <label class="file-btn">
      OPEN VIDEO
      <input type="file" id="fileInput" accept="video/*" style="display: none;">
    </label>
  </header>

  <!-- Video Player -->
  <div class="viewport">
    <video id="player" playsinline webkit-playsinline></video>
    <div class="empty-state" id="emptyPlaceholder">TAP "OPEN VIDEO" TO BEGIN</div>
  </div>

  <!-- Visual Timeline -->
  <div class="timeline-container">
    <div class="timeline-track" id="timeline">
      <div class="playhead" id="playhead" style="left: 0%;"></div>
    </div>
    <div class="time-info">
      <span id="curTime">00:00.0</span>
      <span id="durTime">00:00.0</span>
    </div>
  </div>

  <!-- Mode Switcher -->
  <div class="mode-bar">
    <button class="mode-btn active-keep" id="modeKeep">● PRESERVE (KEEP)</button>
    <button class="mode-btn" id="modeCut">✕ CUT (DISCARD)</button>
  </div>

  <!-- Logged Segments -->
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <span>LOGGED INTERVALS (<span id="count">0</span>)</span>
      <span id="finalDuration">KEEP: 0.0s</span>
    </div>
    <div id="segmentList"></div>
  </div>

  <!-- Controls Deck (Thumb Zone) -->
  <div class="controls-deck">
    <div class="transport-row">
      <button class="step-btn" id="sub5">-5s</button>
      <button class="step-btn play-btn" id="togglePlay">▶ PLAY</button>
      <button class="step-btn" id="add5">+5s</button>
    </div>

    <button class="trigger-btn trigger-idle" id="cutTrigger">
      MARK IN (START)
    </button>
  </div>

  <!-- Export Strip -->
  <div class="export-bar">
    <button class="exp-btn primary" id="btnExportWeb">EXPORT HD MP4</button>
    <button class="exp-btn" id="btnExportCmd">COPY LOSSLESS FFMPEG</button>
  </div>

  <script>
    const player = document.getElementById('player');
    const fileInput = document.getElementById('fileInput');
    const emptyPlaceholder = document.getElementById('emptyPlaceholder');
    const timeline = document.getElementById('timeline');
    const playhead = document.getElementById('playhead');
    const curTime = document.getElementById('curTime');
    const durTime = document.getElementById('durTime');
    const modeKeep = document.getElementById('modeKeep');
    const modeCut = document.getElementById('modeCut');
    const togglePlay = document.getElementById('togglePlay');
    const sub5 = document.getElementById('sub5');
    const add5 = document.getElementById('add5');
    const cutTrigger = document.getElementById('cutTrigger');
    const segmentList = document.getElementById('segmentList');
    const countBadge = document.getElementById('count');
    const finalDurationText = document.getElementById('finalDuration');

    let mode = 'PRESERVE'; // 'PRESERVE' or 'CUT'
    let isMarking = false;
    let markStart = 0;
    let intervals = [];

    // Format seconds to mm:ss.s
    function formatTime(s) {
      if (isNaN(s)) return "00:00.0";
      const m = Math.floor(s / 60);
      const sec = (s % 60).toFixed(1);
      return `${String(m).padStart(2, '0')}:${sec.padStart(4, '0')}`;
    }

    // Load Local File
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      emptyPlaceholder.style.display = 'none';
      player.src = URL.createObjectURL(file);
      player.load();
      intervals = [];
      render();
    });

    player.addEventListener('loadedmetadata', () => {
      durTime.textContent = formatTime(player.duration);
      render();
    });

    player.addEventListener('timeupdate', () => {
      curTime.textContent = formatTime(player.currentTime);
      if (player.duration) {
        const pct = (player.currentTime / player.duration) * 100;
        playhead.style.left = `${pct}%`;
      }
    });

    // Transport controls
    togglePlay.addEventListener('click', () => {
      if (player.paused) {
        player.play();
        togglePlay.textContent = "⏸ PAUSE";
      } else {
        player.pause();
        togglePlay.textContent = "▶ PLAY";
      }
    });

    sub5.addEventListener('click', () => { player.currentTime = Math.max(0, player.currentTime - 5); });
    add5.addEventListener('click', () => { player.currentTime = Math.min(player.duration || 0, player.currentTime + 5); });

    // Mode Selector
    modeKeep.addEventListener('click', () => {
      mode = 'PRESERVE';
      modeKeep.classList.add('active-keep');
      modeCut.classList.remove('active-cut');
      render();
    });

    modeCut.addEventListener('click', () => {
      mode = 'CUT';
      modeCut.classList.add('active-cut');
      modeKeep.classList.remove('active-keep');
      render();
    });

    // Ergonomic Trigger Logic (Zero Tap Latency)
    cutTrigger.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      const now = player.currentTime;

      if (!isMarking) {
        isMarking = true;
        markStart = now;
        cutTrigger.textContent = "MARK OUT (SAVE)";
        cutTrigger.className = "trigger-btn trigger-recording";
      } else {
        isMarking = false;
        if (now > markStart) {
          intervals.push({
            id: crypto.randomUUID(),
            start: parseFloat(markStart.toFixed(2)),
            end: parseFloat(now.toFixed(2)),
            type: mode
          });
        }
        cutTrigger.textContent = "MARK IN (START)";
        cutTrigger.className = "trigger-btn trigger-idle";
        render();
      }
    });

    // Scrubber Navigation
    timeline.addEventListener('click', (e) => {
      if (!player.duration) return;
      const rect = timeline.getBoundingClientRect();
      const clickRatio = (e.clientX - rect.left) / rect.width;
      player.currentTime = clickRatio * player.duration;
    });

    function nudge(id, point, delta) {
      const item = intervals.find(x => x.id === id);
      if (!item) return;
      if (point === 'start') item.start = Math.max(0, +(item.start + delta).toFixed(2));
      if (point === 'end') item.end = Math.min(player.duration || 9999, +(item.end + delta).toFixed(2));
      if (item.start >= item.end) item.end = item.start + 0.1;
      render();
    }

    function removeInterval(id) {
      intervals = intervals.filter(x => x.id !== id);
      render();
    }

    // Keep Interval Calculation
    function computeKeepSegments() {
      const dur = player.duration || 0;
      if (dur === 0) return [];
      
      const sorted = [...intervals].sort((a, b) => a.start - b.start);

      if (mode === 'PRESERVE') {
        // Direct union of preserved intervals
        return sorted;
      } else {
        // Inverse of cut intervals
        const keeps = [];
        let cursor = 0;
        for (const cut of sorted) {
          if (cut.start > cursor) keeps.push({ start: cursor, end: cut.start });
          cursor = Math.max(cursor, cut.end);
        }
        if (cursor < dur) keeps.push({ start: cursor, end: dur });
        return keeps;
      }
    }

    function render() {
      const dur = player.duration || 0;
      countBadge.textContent = intervals.length;

      // Update timeline overlays
      timeline.querySelectorAll('.segment-overlay').forEach(el => el.remove());
      intervals.forEach(iv => {
        if (!dur) return;
        const div = document.createElement('div');
        div.className = `segment-overlay ${iv.type === 'PRESERVE' ? 'segment-keep' : 'segment-cut'}`;
        div.style.left = `${(iv.start / dur) * 100}%`;
        div.style.width = `${((iv.end - iv.start) / dur) * 100}%`;
        timeline.appendChild(div);
      });

      // Update Segments List
      segmentList.innerHTML = '';
      intervals.forEach((iv, idx) => {
        const row = document.createElement('div');
        row.className = 'segment-card';
        row.innerHTML = `
          <div>
            <strong>#${idx + 1}</strong> ${iv.type}: ${iv.start}s → ${iv.end}s
          </div>
          <div class="nudge-group">
            <button class="nudge-btn" onclick="nudge('${iv.id}', 'start', -0.5)">-</button>
            <button class="nudge-btn" onclick="nudge('${iv.id}', 'end', +0.5)">+</button>
            <button class="del-btn" onclick="removeInterval('${iv.id}')">✕</button>
          </div>
        `;
        segmentList.appendChild(row);
      });

      // Summary Time
      const keeps = computeKeepSegments();
      const totalSec = keeps.reduce((acc, cur) => acc + (cur.end - cur.start), 0);
      finalDurationText.textContent = `KEEP: ${totalSec.toFixed(1)}s`;
    }

    // High-Bitrate In-Browser Export (16 Mbps Target)
    document.getElementById('btnExportWeb').addEventListener('click', async () => {
      const keeps = computeKeepSegments();
      if (!keeps.length) return alert('No segments to export');

      const stream = player.captureStream ? player.captureStream() : player.mozCaptureStream();
      const mime = MediaRecorder.isTypeSupported('video/mp4;codecs=avc1') ? 'video/mp4' : 'video/webm';
      
      const recorder = new MediaRecorder(stream, {
        mimeType: mime,
        videoBitsPerSecond: 16000000, // 16 Mbps high-fidelity
        audioBitsPerSecond: 256000
      });

      const chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `cutflow_export.${mime.includes('mp4') ? 'mp4' : 'webm'}`;
        a.click();
      };

      recorder.start();
      for (const seg of keeps) {
        player.currentTime = seg.start;
        await player.play();
        const durationMs = (seg.end - seg.start) * 1000;
        await new Promise(r => setTimeout(r, durationMs));
        player.pause();
      }
      recorder.stop();
    });

    // Lossless FFmpeg Command Generator
    document.getElementById('btnExportCmd').addEventListener('click', () => {
      const keeps = computeKeepSegments();
      if (!keeps.length) return alert('No segments selected');

      const filters = keeps.map((k, i) => `[0:v]trim=${k.start}:${k.end},setpts=PTS-STARTPTS[v${i}];[0:a]atrim=${k.start}:${k.end},asetpts=PTS-STARTPTS[a${i}]`).join(';');
      const map = keeps.map((_, i) => `[v${i}][a${i}]`).join('');
      const cmd = `ffmpeg -i input.mp4 -filter_complex "${filters};${map}concat=n=${keeps.length}:v=1:a=1[outv][outa]" -map "[outv]" -map "[outa]" output.mp4`;

      navigator.clipboard.writeText(cmd);
      alert('Lossless FFmpeg command copied to clipboard!');
    });
  </script>
</body>
</html>
